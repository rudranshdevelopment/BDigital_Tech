version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdigital-tech-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - PORT=80
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/bdigital_tech
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-917709629488}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:80/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bdigital-network

  mongo:
    image: mongo:7-jammy
    container_name: bdigital-tech-db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bdigital-network

volumes:
  mongo_data:
    driver: local

networks:
  bdigital-network:
    driver: bridge
